name: Sync to Notion

# Pushes triaged weak-signal candidates into the Notion library.
# - schedule: runs after the daily scan finishes (the daily scan's bot commit does NOT
#   trigger push-events, so the schedule covers the daily file).
# - push: fires when YOU upload substack-candidates.json / wild-candidates.json.
# - manual: run any time from the Actions tab.
# Idempotent (dedup by Signal ID), so overlapping triggers never duplicate.

on:
  # Runs the moment a scan finishes (Oct 2026) — no more waiting for the next timed slot.
  workflow_run:
    workflows: ["Daily signal scan", "Wild scan"]
    types: [completed]
  schedule:
    - cron: "40 11 * * *"   # ~6:40am CT, ~23 min after the daily scan
  push:
    branches: [main]
    paths:
      - "candidates.json"
      - "substack-candidates.json"
      - "wild-candidates.json"
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Re-check the whole archive (slow; normally only the last 10 days)"
        type: boolean
        default: false

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Push candidates to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          FULL_SYNC: ${{ inputs.full_sync && '1' || '0' }}
        run: node push-to-notion.mjs
