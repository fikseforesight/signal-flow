name: Re-triage untriaged backlog

# One-off / on-demand. Finds Notion pages that were saved as raw, untriaged items during an
# AI outage, runs them through the normal triage + critique passes, and writes the results
# back onto the same pages. Safe to re-run: it only touches pages still Pending AND raw.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: backlog
        options:
          - backlog
          - credibility + recritique
          - critique-missing
          - archdaily corroboration
      since:
        description: "Credibility / critique: items created on/after (YYYY-MM-DD)"
        default: "2026-10-01"

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  retriage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NO_AUTORUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credibility gate
        if: ${{ inputs.task == 'credibility + recritique' }}
        run: node retriage.mjs credibility "${{ inputs.since }}"
      - name: Three-round critique (all Pending weak signals / wild cards)
        if: ${{ inputs.task == 'credibility + recritique' }}
        run: node retriage.mjs recritique "${{ inputs.since }}"
      - name: ArchDaily corroboration (2+ independent credible outlets)
        if: ${{ inputs.task == 'archdaily corroboration' }}
        run: node retriage.mjs archdaily
      - name: Critique items that have none
        if: ${{ inputs.task == 'critique-missing' }}
        run: node retriage.mjs critique "${{ inputs.since }}"
      - name: Daily backlog
        if: ${{ inputs.task == 'backlog' || inputs.task == '' }}
        run: |
          node retriage.mjs fetch daily
          RAW_INPUT_FILE=raw-retriage-daily.json SOURCES_FILE=sources.json OUTPUT_FILE=retriage-daily-candidates.json ARCHIVE_PREFIX=retriage-daily node scan.mjs
          node retriage.mjs apply daily
      - name: Wild backlog
        if: ${{ always() && (inputs.task == 'backlog' || inputs.task == '') }}
        run: |
          node retriage.mjs fetch wild
          RAW_INPUT_FILE=raw-retriage-wild.json SOURCES_FILE=sources-wild.json OUTPUT_FILE=retriage-wild-candidates.json ARCHIVE_PREFIX=retriage-wild node scan.mjs
          node retriage.mjs apply wild
      - name: Archive results
        if: always()
        run: |
          git config user.name "signal-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/retriage-*.json || true
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "Re-triage backlog $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
