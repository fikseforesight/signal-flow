name: Daily signal scan

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # alert issues: AI failures + strong candidates

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scan (triage + critique pass)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scan.mjs

      - name: Commit fresh candidates
        run: |
          git config user.name "signal-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily scan $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Review queue + alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node alert.mjs

      - name: Fail the run if AI triage did not run
        run: |
          node -e 'const s=require("./scan-status.json"); if(s.ai==="failed"||s.ai==="no-key"){console.error("AI pass: "+s.ai+" — "+s.error); process.exit(1)}'
